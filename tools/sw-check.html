<!DOCTYPE html>
<!-- Developer test page: registers sw.js, waits for it, and lists what was cached.
     Open via tools\serve.ps1 at http://localhost:8080/tools/sw-check.html -->
<html>
<head><meta charset="UTF-8"><title>SW check</title></head>
<body>
<pre id="out">running...</pre>
<script>
  var out = document.getElementById('out');
  function log(s) {
    out.textContent += '\n' + s;
    // Also report to the dev server log (shows up as a 404 line), for headless runs
    fetch('../__report/' + encodeURIComponent(s))['catch'](function () {});
  }

  navigator.serviceWorker.register('../sw.js', { scope: '../' })
    .then(function () { return navigator.serviceWorker.ready; })
    .then(function (reg) {
      log('SW_STATE=' + (reg.active && reg.active.state));
      return caches.keys();
    })
    .then(function (keys) {
      log('CACHES=' + keys.join(','));
      return caches.open(keys[0]).then(function (c) { return c.keys(); });
    })
    .then(function (reqs) {
      log('CACHED_COUNT=' + reqs.length);
      reqs.forEach(function (r) { log('  ' + new URL(r.url).pathname); });
      // Range request test (how iOS Safari loads audio)
      return fetch('../Assets/audio/thales.mp3', { headers: { Range: 'bytes=0-99' } });
    })
    .then(function (r) {
      log('RANGE_STATUS=' + r.status + ' ' + r.headers.get('Content-Range'));
      return fetch('../manifest.webmanifest').then(function (m) { return m.json(); });
    })
    .then(function (m) { log('MANIFEST_NAME=' + m.name); log('DONE'); })
    ['catch'](function (e) { log('ERROR=' + e); });
</script>
</body>
</html>
